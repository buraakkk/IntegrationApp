specVersion: "3.1"
metadata:
  name: integration
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /second
            url: https://e27714b0trial.it-cpitrial06.cfapps.us10-001.hana.ondemand.com
            destination: Prabhat_Integration_Suite  
          - path: /api
            url: https://f38ebb9dtrial.it-cpitrial05.cfapps.us10-001.hana.ondemand.com
            destination: Authentication 
          - path: /third
            url: https://f38ebb9dtrial.it-cpitrial05.cfapps.us10-001.hana.ondemand.com     
            destination: Authentication     
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /api/v1
            generateMockData: true
            metadataXmlPath: ./webapp/localService/metadata.xml
            mockdataRootPath: ./webapp/localService/data
        annotations: []
